[package]
name = "antigravity_sw"
version = "6.0.3"
description = "Anti tools for AI"
authors = ["you"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "antigravity_sw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.2.5", features = [] }

[dependencies]
tauri = { version = "^2.2.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
dirs = "5.0"
# "http2" is NOT a default here (default-features is off), so without it every
# request falls back to HTTP/1.1 - which the Remote Terminal transport feels
# directly: one keystroke is one POST /term/input, and H1 cannot multiplex, so
# two keystrokes in flight at once force a SECOND TCP+TLS handshake (measured:
# 65ms on a warm connection vs 150ms-1.1s on a cold one). With h2 the input
# POSTs and the SSE stream share a single connection that the stream itself
# keeps warm. See `client()` in modules/remote_terminal_http.rs.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "blocking", "rustls-tls", "http2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sysinfo = "0.31"
tokio = { version = "1", features = ["full"] }
url = "2.5.7"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-clipboard-manager = "2"
image = { version = "0.25.9", default-features = false, features = ["png", "webp"] }
thiserror = "2.0.17"

# 反代服务依赖
axum = { version = "0.7", features = ["multipart"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }

hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
eventsource-stream = "0.2"
dashmap = "6.1"
anyhow = "1.0"
futures = "0.3"
rand = "0.8"                        # 生成 sessionId 和 mock project_id
async-stream = "0.3.6"              # 简化异步流生成
regex = "1.12.2"                    # Duration 解析
once_cell = "1.19"                  # 静态初始化 (模型映射表)
pin-project = "1.1"                 # Pin 投影辅助
bytes = "1.5"                       # SSE 字节操作
tauri-plugin-single-instance = { version = "2.3.6", features = ["deep-link"] }
libc = "0.2"
rcgen = "0.13"
tracing-appender = "0.2.4"
tracing-log = "0.2.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
tauri-plugin-window-state = "2"
parking_lot = "0.12.5"
tokio-util = "0.7.18"
aes-gcm = "0.10.3"
machine-uid = "0.5.4"
plist = "1.7"
rquest = { version = "5.1.0", features = ["json", "stream", "socks", "cookies"] }
rquest-util = "2.2.1"
hostname = "0.4"
portable-pty = "0.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
